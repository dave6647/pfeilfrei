plugins {
    id 'com.android.application'
}

// Die Build-Nummer von GitHub wird zur Versionsnummer, damit sich neue
// APKs über alte installieren lassen.
def buildNumber = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")

android {
    namespace 'de.pfeilfrei.game'
    compileSdk 36

    defaultConfig {
        applicationId 'de.pfeilfrei.game'
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    buildFeatures {
        buildConfig true
    }

    // Zwei APKs mit derselben App-ID (ersetzen sich gegenseitig, der Spielstand bleibt):
    // - store: so wie im Play Store. Gratis-Version, die Vollversion wird in der App gekauft.
    // - vollTest: zum Testen ohne Play Store, alles freigeschaltet. Nicht in den Play Store hochladen!
    flavorDimensions 'edition'
    productFlavors {
        store {
            dimension 'edition'
            buildConfigField 'boolean', 'TEST_FULL', 'false'
        }
        vollTest {
            dimension 'edition'
            buildConfigField 'boolean', 'TEST_FULL', 'true'
            versionNameSuffix '-voll-test'
        }
    }

    // Zwei Schlüssel:
    // - test: für die APKs auf GitHub (immer gleich, damit Updates ohne Deinstallieren gehen).
    // - upload: für das AAB, das in die Play Console hochgeladen wird. Schlüssel und Passwort stehen nur in den
    //   GitHub-Secrets UPLOAD_KEYSTORE_BASE64 / UPLOAD_KEYSTORE_PASSWORD; der Workflow legt upload.keystore
    //   nur für den AAB-Schritt an (nie committen, steht in .gitignore).
    //   Google signiert die App danach mit dem eigenen App-Signaturschlüssel (Play App Signing).
    def uploadPassword = System.getenv("UPLOAD_KEYSTORE_PASSWORD")
    signingConfigs {
        test {
            storeFile file('pfeilfrei-test.keystore')
            storePassword 'pfeilfrei'
            keyAlias 'pfeilfrei'
            keyPassword 'pfeilfrei'
        }
        if (uploadPassword) {
            upload {
                storeFile file('upload.keystore')
                storePassword uploadPassword
                keyAlias 'upload'
                keyPassword uploadPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Mit Passwort (nur beim AAB-Schritt im Workflow gesetzt) → Upload-Schlüssel, sonst Test-Schlüssel
            signingConfig uploadPassword ? signingConfigs.upload : signingConfigs.test
        }
        debug {
            signingConfig signingConfigs.test
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Play Billing für den Kauf der Vollversion (ab 31.08.2026 verlangt Play mindestens Version 8)
    implementation 'com.android.billingclient:billing:9.1.0'
    // Billing bringt Kotlin-Bibliotheken in zwei Versionen mit (stdlib 1.8 und stdlib-jdk7/-jdk8 1.6);
    // die BOM zieht alle auf dieselbe Version, sonst „Duplicate class kotlin…“
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
