<script>
(() => {
'use strict';

// ENGINE START
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // hoch, rechts, runter, links

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Version der Level-Erzeugung. Wird gespeichert, damit ein laufendes Level nach einem Update,
// das die Felder ändert, nicht mit den entfernten Pfeilen des alten Feldes wiederhergestellt wird.
const LEVEL_GEN = 2;

// Schwierigkeitskurve
//   Level 1–30: Einstieg, Feld wächst von 4×5 auf 11×15 (unverändert seit Build 1).
//   Ab Level 31 wird es ohne Ende schwerer, aber immer langsamer: p = log2(n / 30),
//   also Level 60 → 1, 120 → 2, 240 → 3, 480 → 4, 960 → 5, 1920 → 6.
//   Feld: 10 + 2,2·p Spalten (mit etwas Abwechslung), 1,6 × so viele Zeilen, höchstens 24 × 38.
//   Pfeile: länger, mehr Kurven, dichter gepackt und ineinander verschlungen (buildWoven).
function levelSpec(n){
  if (n <= 30) {
    let cols, rows;
    if (n <= 3) { cols = 4; rows = 5; }
    else {
      cols = Math.min(4 + Math.floor((n - 1) / 3), 11);
      rows = Math.min(Math.round(cols * 1.38), 15);
    }
    const counts = [3, 4, 6, 8, 11];
    return {
      cols, rows,
      maxArrows: n <= counts.length ? counts[n - 1] : Infinity,
      minLen: 2,
      maxLen: n <= 3 ? 3 : Math.min(3 + Math.floor(n / 4), 12),
      turnP: Math.min(0.18 + n * 0.012, 0.5),
    };
  }
  const p = Math.log2(n / 30);
  // Abwechslung: meist so groß wie der Trend, öfter etwas kleiner (Verschnaufpause), selten größer
  const jitter = [-2, -1, -1, 0, 0, 0, 1][Math.floor(mulberry32(n * 31 + 7)() * 7)];
  const cols = Math.min(Math.max(9, Math.round(10 + 2.2 * p) + jitter), 24);
  const maxLen = Math.round(10 + 2 * p);
  return {
    cols, rows: Math.round(cols * 1.6),
    woven: true,
    minLen: Math.min(3 + Math.floor(p / 2), 4),
    maxLen,
    extLen: maxLen * 3,                       // so lang dürfen Pfeile beim Lückenfüllen werden
    turnP: Math.min(0.5 + 0.06 * p, 0.75),    // Neigung abzubiegen
    weave: Math.min(0.25 * p, 0.85),          // Neigung, sich an andere Pfeile zu schmiegen
    slots: Math.min(0.25 * p, 1),             // Anteil Pfeile, deren Weg schon beim Platzieren versperrt sein darf
    maxFree: Math.max(0.4 - 0.04 * p, 0.18),  // höchstens so viele Pfeile dürfen am Anfang frei sein
  };
}

function buildLevel(spec, seed){
  const rng = mulberry32(seed);
  const W = spec.cols, H = spec.rows;
  const occ = new Int16Array(W * H).fill(-1);
  const arrows = [];
  const inB = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  function tryPlace(hx, hy, d, targetLen){
    const h = hy * W + hx;
    if (occ[h] !== -1) return false;
    // Der Weg vom Kopf bis zum Rand muss beim Platzieren frei sein:
    // so ist jedes Level garantiert lösbar (in umgekehrter Reihenfolge).
    const ray = new Set();
    let cx = hx + DIRS[d][0], cy = hy + DIRS[d][1];
    while (inB(cx, cy)) { const c = cy * W + cx; if (occ[c] !== -1) return false; ray.add(c); cx += DIRS[d][0]; cy += DIRS[d][1]; }
    const bx = hx - DIRS[d][0], by = hy - DIRS[d][1];
    if (!inB(bx, by) || occ[by * W + bx] !== -1) return false;
    const body = [h, by * W + bx];
    const inBody = new Set(body);
    let x = bx, y = by, g = (d + 2) % 4;
    while (body.length < targetLen) {
      const left = (g + 3) % 4, right = (g + 1) % 4;
      const turnFirst = rng() < spec.turnP, lr = rng() < 0.5;
      const order = turnFirst ? (lr ? [left, right, g] : [right, left, g]) : (lr ? [g, left, right] : [g, right, left]);
      let moved = false;
      for (const nd of order) {
        const nx = x + DIRS[nd][0], ny = y + DIRS[nd][1];
        if (!inB(nx, ny)) continue;
        const c = ny * W + nx;
        if (occ[c] !== -1 || inBody.has(c) || ray.has(c)) continue;
        x = nx; y = ny; g = nd; body.push(c); inBody.add(c); moved = true; break;
      }
      if (!moved) break;
    }
    if (body.length < spec.minLen) return false;
    const cells = body.reverse(); // Schwanz ... Kopf
    const id = arrows.length;
    for (const c of cells) occ[c] = id;
    arrows.push({ id, cells, dir: d, color: Math.floor(rng() * 8) });
    return true;
  }

  let tries = 0;
  const maxTries = W * H * 30;
  while (arrows.length < spec.maxArrows && tries < maxTries) {
    tries++;
    const c = Math.floor(rng() * W * H);
    if (occ[c] !== -1) continue;
    const d = Math.floor(rng() * 4);
    const L = spec.minLen + Math.floor(rng() * (spec.maxLen - spec.minLen + 1));
    tryPlace(c % W, Math.floor(c / W), d, L);
  }
  if (spec.maxArrows === Infinity) {
    for (const c of shuffle([...Array(W * H).keys()])) {
      if (occ[c] !== -1) continue;
      for (const d of shuffle([0, 1, 2, 3])) if (tryPlace(c % W, Math.floor(c / W), d, spec.maxLen)) break;
    }
  }
  // Nachbarn bekommen unterschiedliche Farben
  for (const a of arrows) {
    const near = new Set();
    for (const c of a.cells) {
      const cx = c % W, cy = Math.floor(c / W);
      for (const [dx, dy] of DIRS) { const nx = cx + dx, ny = cy + dy; if (inB(nx, ny)) { const o = occ[ny * W + nx]; if (o !== -1 && o < a.id) near.add(arrows[o].color); } }
    }
    let k = a.color, guard = 0;
    while (near.has(k) && guard++ < 8) k = (k + 1) % 8;
    a.color = k;
  }
  return { W, H, arrows };
}

// Ab Level 31: dicht gepackt und verschlungen.
// Jeder Pfeil bekommt einen Rang r (kleiner = muss früher raus). Lösbar bleibt das Level, solange gilt:
//   - Liegt Pfeil C auf dem Weg von X, muss C vor X raus: r(C) < r(X)
//   - Liegt X auf dem Weg von B, muss X vor B raus:       r(X) < r(B)
// Ein neuer Pfeil darf also auch dorthin, wo sein Weg schon versperrt ist, wenn es dafür noch einen Rang gibt.
// Danach wachsen die Schwänze in übrig gebliebene Lücken hinein (gleiche Regeln).
function buildWoven(spec, seed){
  const rng = mulberry32(seed);
  const W = spec.cols, H = spec.rows, N = W * H;
  const occ = new Int16Array(N).fill(-1);
  const rmin = new Float64Array(N).fill(Infinity); // kleinster Rang aller Pfeile, deren Weg durch diese Zelle führt
  const arrows = [];
  let gmin = 0;
  const inB = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  // Wie gut passt Zelle c als nächstes Körperstück? Punkte für Nachbarn aus anderen Pfeilen,
  // für den eigenen Körper (Schlaufen), für den Rand und dafür, einem anderen Pfeil den Weg zu versperren.
  function weaveScore(c, inBody, prev){
    const cx = c % W, cy = (c - cx) / W;
    let s = rmin[c] < Infinity ? 1.2 : 0;
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy;
      if (!inB(nx, ny)) { s += 0.3; continue; }
      const o = ny * W + nx;
      if (o === prev) continue;
      if (occ[o] !== -1) s += 1; else if (inBody.has(o)) s += 0.6;
    }
    return s;
  }

  function tryPlace(hx, hy, d, targetLen, slot){
    const h = hy * W + hx;
    if (occ[h] !== -1) return false;
    const ray = new Set();
    let lo = -Infinity; // höchster Rang der Pfeile auf dem Weg (die müssen vorher raus)
    let cx = hx + DIRS[d][0], cy = hy + DIRS[d][1];
    while (inB(cx, cy)) {
      const c = cy * W + cx, o = occ[c];
      if (o !== -1) { if (!slot) return false; if (arrows[o].r > lo) lo = arrows[o].r; }
      ray.add(c); cx += DIRS[d][0]; cy += DIRS[d][1];
    }
    let hi = rmin[h];   // niedrigster Rang der Pfeile, denen X im Weg steht (die müssen danach raus)
    if (hi <= lo) return false;
    const bx = hx - DIRS[d][0], by = hy - DIRS[d][1];
    if (!inB(bx, by)) return false;
    const b0 = by * W + bx;
    if (occ[b0] !== -1 || rmin[b0] <= lo) return false;
    hi = Math.min(hi, rmin[b0]);
    const body = [h, b0];
    const inBody = new Set(body);
    let x = bx, y = by, g = (d + 2) % 4;
    while (body.length < targetLen) {
      const left = (g + 3) % 4, right = (g + 1) % 4;
      const turnFirst = rng() < spec.turnP, lr = rng() < 0.5;
      const order = turnFirst ? (lr ? [left, right, g] : [right, left, g]) : (lr ? [g, left, right] : [g, right, left]);
      const pick = rng() < spec.weave;
      let best = -1, bestS = -1;
      for (const nd of order) {
        const nx = x + DIRS[nd][0], ny = y + DIRS[nd][1];
        if (!inB(nx, ny)) continue;
        const c = ny * W + nx;
        if (occ[c] !== -1 || inBody.has(c) || ray.has(c) || rmin[c] <= lo) continue;
        if (!pick) { best = nd; break; }
        const sc = weaveScore(c, inBody, y * W + x) + (nd === order[0] ? 0.5 : 0);
        if (sc > bestS) { bestS = sc; best = nd; }
      }
      if (best < 0) break;
      x += DIRS[best][0]; y += DIRS[best][1]; g = best;
      const c = y * W + x; body.push(c); inBody.add(c);
      if (rmin[c] < hi) hi = rmin[c];
    }
    if (body.length < spec.minLen) return false;
    let r;
    if (lo === -Infinity) r = Math.min(hi, gmin) - 0.5 - rng();
    else if (hi === Infinity) r = lo + 0.5 + rng();
    else { r = lo + (hi - lo) * (0.25 + 0.5 * rng()); if (!(r > lo && r < hi)) return false; }
    if (r < gmin) gmin = r;
    const cells = body.reverse(); // Schwanz ... Kopf
    const id = arrows.length;
    for (const c of cells) occ[c] = id;
    for (const c of ray) if (r < rmin[c]) rmin[c] = r;
    arrows.push({ id, cells, dir: d, color: Math.floor(rng() * 8), r, ray });
    return true;
  }

  // 1. Zufällige Pfeile, eher lang
  for (let tries = 0; tries < N * 30; tries++) {
    const c = Math.floor(rng() * N);
    if (occ[c] !== -1) continue;
    const d = Math.floor(rng() * 4);
    const L = spec.minLen + Math.floor(Math.sqrt(rng()) * (spec.maxLen - spec.minLen + 1));
    tryPlace(c % W, Math.floor(c / W), d, L, rng() < spec.slots);
  }
  // 2. Jede freie Zelle als Kopf versuchen
  for (const c of shuffle([...Array(N).keys()])) {
    if (occ[c] !== -1) continue;
    for (const d of shuffle([0, 1, 2, 3])) if (tryPlace(c % W, Math.floor(c / W), d, spec.maxLen, true)) break;
  }
  // 3. Lücken schließen: Schwänze wachsen in freie Nachbarzellen
  for (let pass = 0, grown = true; grown && pass < 40; pass++) {
    grown = false;
    for (const a of shuffle(arrows.slice())) {
      if (a.cells.length >= spec.extLen) continue;
      const t = a.cells[0], tx = t % W, ty = (t - tx) / W;
      for (const k of shuffle([0, 1, 2, 3])) {
        const nx = tx + DIRS[k][0], ny = ty + DIRS[k][1];
        if (!inB(nx, ny)) continue;
        const e = ny * W + nx;
        if (occ[e] !== -1 || a.ray.has(e) || rmin[e] <= a.r) continue;
        a.cells.unshift(e); occ[e] = a.id; grown = true; break;
      }
    }
  }
  // Nachbarn bekommen unterschiedliche Farben
  for (const a of arrows) {
    const near = new Set();
    for (const c of a.cells) {
      const cx = c % W, cy = Math.floor(c / W);
      for (const [dx, dy] of DIRS) { const nx = cx + dx, ny = cy + dy; if (inB(nx, ny)) { const o = occ[ny * W + nx]; if (o !== -1 && o < a.id) near.add(arrows[o].color); } }
    }
    let k = a.color, guard = 0;
    while (near.has(k) && guard++ < 8) k = (k + 1) % 8;
    a.color = k;
  }
  return { W, H, arrows: arrows.map(a => ({ id: a.id, cells: a.cells, dir: a.dir, color: a.color })) };
}

function freeArrows(level, alive){
  const { W, H, arrows } = level;
  const occ = new Int16Array(W * H).fill(-1);
  for (const a of arrows) if (alive[a.id]) for (const c of a.cells) occ[c] = a.id;
  const out = [];
  for (const a of arrows) {
    if (!alive[a.id]) continue;
    if (blockerOf(level, occ, a).id === -1) out.push(a.id);
  }
  return out;
}

function blockerOf(level, occ, a){
  const { W, H } = level;
  const head = a.cells[a.cells.length - 1];
  let x = head % W + DIRS[a.dir][0], y = Math.floor(head / W) + DIRS[a.dir][1], j = 0;
  while (x >= 0 && y >= 0 && x < W && y < H) {
    const o = occ[y * W + x];
    if (o !== -1 && o !== a.id) return { id: o, steps: j };
    x += DIRS[a.dir][0]; y += DIRS[a.dir][1]; j++;
  }
  return { id: -1, steps: j };
}

// seed: ohne Angabe aus der Levelnummer (Klassisch/Hardcore, immer gleich),
// im Blitzmodus zufällig (gleiche Schwierigkeit wie Level n, aber anderes Feld).
function generateLevel(n, seed){
  const spec = levelSpec(n);
  const base = seed === undefined ? n * 7919 + 17 : seed;
  if (spec.woven) {
    // bis zu 12 Versuche, bis höchstens maxFree der Pfeile am Anfang frei sind; sonst der schwerste
    let best = null, bestFree = Infinity;
    for (let v = 0; v < 12; v++) {
      const lv = buildWoven(spec, base + v * 104729);
      lv.n = n;
      const free = freeArrows(lv, lv.arrows.map(() => true)).length / lv.arrows.length;
      if (free <= spec.maxFree) return lv;
      if (free < bestFree) { bestFree = free; best = lv; }
    }
    return best;
  }
  let best = null;
  for (let v = 0; v < 30; v++) {
    const lv = buildLevel(spec, base + v * 104729);
    const alive = lv.arrows.map(() => true);
    const free = freeArrows(lv, alive).length;
    const total = lv.arrows.length;
    lv.n = n;
    if (n === 1) return lv;
    if (total < Math.min(spec.maxArrows, 3)) continue;
    if (free === total) { best = best || lv; continue; }
    if (n >= 6 && free / total > 0.4) { best = best || lv; continue; }
    return lv;
  }
  return best || buildLevel(spec, base);
}

/* ---------- Speicher (Android-Brücke oder Browser) ---------- */
const Store = {
  get(k, def){
    try {
      const raw = window.AndroidBridge ? window.AndroidBridge.load(k) : localStorage.getItem('pfeilfrei_' + k);
      return raw ? JSON.parse(raw) : def;
    } catch (e) { return def; }
  },
  set(k, v){
    try {
      const s = JSON.stringify(v);
      if (window.AndroidBridge) window.AndroidBridge.save(k, s); else localStorage.setItem('pfeilfrei_' + k, s);
    } catch (e) {}
  }
};
const progress = Object.assign({ level: 1, flawless: 0, hints: 3, sound: true, vib: true, lang: 'en' }, Store.get('progress', {}));
// Hardcore hat einen eigenen Spielstand: 5 Herzen für alle Level, eigene Tipps, Rekord (höchstes erreichtes Level).
const HC_HEARTS = 5;
const HC_RESET = { level: 1, hearts: HC_HEARTS, hints: 3, newBest: false };
progress.hc = Object.assign({ best: 1, intro: false }, HC_RESET, progress.hc);
if (!(progress.hc.hearts > 0)) Object.assign(progress.hc, HC_RESET);
// Laufendes Level je Modus (welche Pfeile schon raus sind, Herzen, Zusammenstöße, bezahlter Tipp).
// Wird bei jedem Zug gespeichert, damit Menü, Moduswechsel und Schließen der App nichts verlieren.
progress.run = Object.assign({ normal: null, hc: null, blitz: null }, progress.run);
// Blitz: zufällige Level gegen die Uhr. Rekord = höchstes erreichtes Level in einem Durchgang.
// Der laufende Durchgang (Level, Startwert des Feldes, Restzeit) liegt in progress.run.blitz.
// Die Zahlen stehen auch im Erklärtext blitzIntroText (alle Sprachen).
const BLITZ_START = 30000, BLITZ_CRASH = 5000, BLITZ_HINT = 3000;
const blitzBonus = arrows => (arrows + 3) * 1000; // pro geschafftem Level: 1 s je Pfeil + 3 s
progress.blitz = Object.assign({ best: 1, intro: false }, progress.blitz);
if (!(Number.isInteger(progress.blitz.best) && progress.blitz.best >= 1)) progress.blitz.best = 1;
const saveProgress = () => Store.set('progress', progress);

/* ---------- Ton & Vibration ---------- */
let ac = null;
function audio(){
  if (!progress.sound) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type, vol, when, slideTo){
  const a = audio(); if (!a) return;
  const t = a.currentTime + (when || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const SCALE = [0, 2, 4, 7, 9];
// Pfeil fährt raus. i = Stelle in der Streak (0 = erster Pfeil): je länger die Streak, desto höher der Ton
// (Pentatonik über zwei Oktaven, danach bleibt sie in der oberen). Bricht die Streak ab, geht es unten wieder los.
function sndRelease(i){
  if (i >= 10) i = 5 + (i - 10) % 5;
  const semis = SCALE[i % 5] + 12 * Math.floor(i / 5);
  const f = 392 * Math.pow(2, semis / 12);
  tone(f, 0.18, 'triangle', 0.11); tone(f * 2, 0.09, 'sine', 0.035);
}
// Jede 5. Streak: kurzes Glitzern obendrauf
function sndStreak(){ [0, 4, 7].forEach((s, i) => tone(2093 * Math.pow(2, s / 12), 0.12, 'sine', 0.03, 0.05 + i * 0.05)); }
function sndCrash(){ tone(150, 0.24, 'sine', 0.28, 0, 50); tone(80, 0.1, 'square', 0.04); }
function sndWin(){ [0, 4, 7, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.34, 'triangle', 0.09, i * 0.085)); }
// Konfetti-Kanone: kurzes Rauschen (Knall) + tiefer Schlag
let noiseBuf = null;
function sndPop(when){
  const a = audio(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.25), a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  }
  const t0 = a.currentTime + (when || 0);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 0.8;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t0); src.stop(t0 + 0.26);
  tone(190, 0.1, 'sine', 0.16, when, 70);
}
// Fehlerfrei: zwei Knalle, Fanfare, danach leises Glitzern
function sndCelebrate(){
  sndPop(0); sndPop(0.12);
  [0, 4, 7, 12, 16, 19].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.36, 'triangle', 0.085, 0.16 + i * 0.075));
  for (let i = 0; i < 7; i++) tone(2093 * Math.pow(2, SCALE[i % 5] / 12 + (i > 4 ? 1 : 0)), 0.18, 'sine', 0.022, 0.55 + i * 0.09 + Math.random() * 0.04);
}
// Hardcore vorbei: absteigende Töne
function sndGameOver(){ [7, 4, 0, -5].forEach((s, i) => tone(392 * Math.pow(2, s / 12), i === 3 ? 0.6 : 0.24, 'triangle', 0.09, i * 0.16)); }
function buzz(ms){
  if (!progress.vib) return;
  try { if (window.AndroidBridge) window.AndroidBridge.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

let C = {};
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  C = { paper: v('--paper'), surface: v('--surface'), ink: v('--ink'), grid: v('--grid'), rule: v('--rule'), gridLine: v('--grid-line'), gridMajor: v('--grid-major'),
        signal: v('--signal'), hint: v('--hint'), lines: [1,2,3,4,5,6,7,8].map(i => v('--l' + i)) };
}
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduceMotion ? 3 : 1;

/* ---------- Spielbrett (Zustand + Animation + Zeichnen) ---------- */
class Board {
  constructor(level){
    this.level = level;
    this.W = level.W; this.H = level.H;
    this.alive = level.arrows.map(() => true);
    this.anim = level.arrows.map(() => null);
    this.gone = level.arrows.map(() => false);
    this.occ = new Int16Array(this.W * this.H).fill(-1);
    for (const a of level.arrows) for (const c of a.cells) this.occ[c] = a.id;
    this.left = level.arrows.length;
    this.flash = null; // {id, t0}
  }
  remove(id){ for (const c of this.level.arrows[id].cells) if (this.occ[c] === id) this.occ[c] = -1; this.alive[id] = false; this.left--; }
  tap(id, now){
    const a = this.level.arrows[id];
    const b = blockerOf(this.level, this.occ, a);
    if (b.id === -1) {
      this.remove(id);
      this.anim[id] = { type: 'exit', t0: now, sMax: b.steps + a.cells.length + 3 };
      return { ok: true };
    }
    this.anim[id] = { type: 'crash', t0: now, target: b.steps + 0.3 };
    this.flash = { id: b.id, t0: now };
    return { ok: false, blocker: b.id };
  }
  // Verschiebung entlang des Weges (in Zellen) zum Zeitpunkt now
  offset(id, now){
    const an = this.anim[id];
    if (!an) return 0;
    const t = (now - an.t0) / 1000 * SPEED;
    if (an.type === 'exit') {
      const s = 7 * t + 32 * t * t;
      if (s >= an.sMax) { this.anim[id] = null; this.gone[id] = true; return an.sMax; }
      return s;
    }
    const t1 = Math.max(0.09, an.target / 16), t2 = 0.26;
    if (t < t1) { const k = t / t1; return an.target * k * k; }
    if (t < t1 + t2) { const k = (t - t1) / t2; return an.target * (1 - (1 - Math.pow(1 - k, 3))); }
    this.anim[id] = null;
    return 0;
  }
  busy(){ return this.anim.some(Boolean); }
  path(a, extra){
    const W = this.W, pts = a.cells.map(c => [c % W, Math.floor(c / W)]);
    const [hx, hy] = pts[pts.length - 1], [dx, dy] = DIRS[a.dir];
    for (let k = 1; k <= extra; k++) pts.push([hx + dx * k, hy + dy * k]);
    return pts;
  }
}

function pointAt(pts, s){
  const i = Math.max(0, Math.min(Math.floor(s), pts.length - 2)), f = s - i;
  return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];
}
function subPath(pts, s0, s1){
  const out = [pointAt(pts, s0)];
  for (let i = Math.floor(s0) + 1; i < s1 - 1e-6; i++) out.push(pts[i]);
  out.push(pointAt(pts, s1));
  return out;
}

function layoutFor(cw, ch, W, H, maxCell){
  const pad = 8;
  const cell = Math.max(8, Math.min((cw - pad * 2) / W, (ch - pad * 2) / H, maxCell));
  return { cell, ox: (cw - cell * W) / 2, oy: (ch - cell * H) / 2 };
}

function tracePath(ctx, pts, L){
  const P = pts.map(([x, y]) => [L.ox + (x + 0.5) * L.cell, L.oy + (y + 0.5) * L.cell]);
  ctx.beginPath();
  ctx.moveTo(P[0][0], P[0][1]);
  const R = L.cell * 0.4;
  for (let i = 1; i < P.length - 1; i++) {
    const lp = Math.hypot(P[i][0] - P[i-1][0], P[i][1] - P[i-1][1]);
    const ln = Math.hypot(P[i+1][0] - P[i][0], P[i+1][1] - P[i][1]);
    const r = Math.min(R, lp * (i === 1 ? 0.95 : 0.5), ln * (i === P.length - 2 ? 0.95 : 0.5));
    if (r > 0.5) ctx.arcTo(P[i][0], P[i][1], P[i+1][0], P[i+1][1], r); else ctx.lineTo(P[i][0], P[i][1]);
  }
  ctx.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
  return P;
}

function drawBoard(ctx, board, L, now, opts){
  const { W, H } = board, cell = L.cell;
  const lw = Math.min(cell * 0.3, 15);
  // Spielfläche
  ctx.fillStyle = C.surface;
  roundRect(ctx, L.ox - 4, L.oy - 4, cell * W + 8, cell * H + 8, Math.min(16, cell * 0.4));
  ctx.fill();
  if (opts && opts.grid) drawGrid(ctx, W, H, L);
  ctx.fillStyle = C.grid;
  const dotR = Math.max(1.2, cell * 0.055);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    ctx.beginPath(); ctx.arc(L.ox + (x + 0.5) * cell, L.oy + (y + 0.5) * cell, dotR, 0, Math.PI * 2); ctx.fill();
  }
  const arrows = board.level.arrows;
  const order = [];
  for (const a of arrows) if (!board.gone[a.id] && (board.alive[a.id] || board.anim[a.id])) order.push(a);
  order.sort((p, q) => (board.anim[p.id] ? 1 : 0) - (board.anim[q.id] ? 1 : 0));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const a of order) {
    const s = board.offset(a.id, now);
    if (board.gone[a.id]) continue;
    const segs = a.cells.length - 1;
    const pts = board.path(a, Math.ceil(s) + 2);
    const sub = subPath(pts, s, s + segs);
    const col = C.lines[a.color];
    // Hinweis- und Kollisions-Leuchten
    let glow = null;
    if (opts && opts.hint === a.id) glow = { c: C.hint, a: 0.45 + 0.25 * Math.sin(now / 160) };
    if (board.flash && board.flash.id === a.id) {
      const k = (now - board.flash.t0) / 650;
      if (k < 1) glow = { c: C.signal, a: 0.6 * (1 - k) }; else board.flash = null;
    }
    if (glow) {
      ctx.globalAlpha = glow.a; ctx.strokeStyle = glow.c; ctx.lineWidth = lw * 2.3;
      tracePath(ctx, sub, L); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    const P = tracePath(ctx, sub, L); ctx.stroke();
    // Pfeilspitze
    const [hx, hy] = P[P.length - 1], [dx, dy] = DIRS[a.dir];
    const tip = cell * 0.4, back = cell * 0.02, half = Math.max(lw * 0.95, cell * 0.24);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(hx + dx * tip, hy + dy * tip);
    ctx.lineTo(hx - dx * back - dy * half, hy - dy * back + dx * half);
    ctx.lineTo(hx - dx * back + dy * half, hy - dy * back - dx * half);
    ctx.closePath(); ctx.fill();
    // Endstation am Schwanz
    const [tx, ty] = P[0];
    ctx.beginPath(); ctx.arc(tx, ty, lw * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = C.surface; ctx.fill();
    ctx.lineWidth = lw * 0.42; ctx.strokeStyle = col; ctx.stroke();
  }
}

// Raster (Knopf in der Fußleiste, progress.grid): Linien zwischen den Zellen, jede 5. kräftiger,
// damit man Reihe und Spalte eines Pfeils über große Felder verfolgen kann. Liegt unter den Pfeilen.
// Linienbreite in Geräte-Pixeln und auf Pixel ausgerichtet, damit die Linien scharf bleiben.
function drawGrid(ctx, W, H, L){
  const s = ctx.getTransform().a || 1, cell = L.cell;
  const x0 = L.ox, y0 = L.oy, x1 = x0 + W * cell, y1 = y0 + H * cell;
  ctx.save();
  ctx.lineCap = 'butt';
  for (const major of [false, true]) {
    const dev = Math.max(1, Math.round((major ? 1.5 : 1) * s)); // 1 bzw. 1,5 CSS-px
    const snap = v => (Math.round(v * s - dev / 2) + dev / 2) / s;
    ctx.lineWidth = dev / s;
    ctx.strokeStyle = major ? C.gridMajor : C.gridLine;
    ctx.beginPath();
    for (let i = 1; i < W; i++) if ((i % 5 === 0) === major) { const x = snap(x0 + i * cell); ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let j = 1; j < H; j++) if ((j % 5 === 0) === major) { const y = snap(y0 + j * cell); ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function pickArrow(board, L, px, py){
  const fx = (px - L.ox) / L.cell - 0.5, fy = (py - L.oy) / L.cell - 0.5;
  let best = -1, bestD = 0.62;
  for (const a of board.level.arrows) {
    if (!board.alive[a.id] || board.anim[a.id]) continue;
    const pts = a.cells.map(c => [c % board.W, Math.floor(c / board.W)]);
    const [hx, hy] = pts[pts.length - 1];
    pts.push([hx + DIRS[a.dir][0] * 0.4, hy + DIRS[a.dir][1] * 0.4]);
    for (let i = 0; i < pts.length - 1; i++) {
      const d = segDist(fx, fy, pts[i], pts[i + 1]);
      if (d < bestD) { bestD = d; best = a.id; }
    }
  }
  return best;
}
function segDist(px, py, [ax, ay], [bx, by]){
  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy;
  const t = l2 ? Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / l2)) : 0;
  return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
}

/* ---------- Canvas-Helfer ---------- */
function fitCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

/* ---------- Konfetti (nur wenn ein Level ohne Zusammenstoß gelöst wird) ----------
   Zwei Kanonen unten links und rechts schießen Schnipsel in den Linienfarben nach oben,
   die dann flatternd herunterfallen. Eigene Zeichenebene (#fx) über dem Ergebnis-Fenster. */
const Confetti = (() => {
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  const rnd = (a, b) => a + Math.random() * (b - a);
  let parts = [], raf = 0, last = 0, W = 0, H = 0, fade = 1, fading = false;

  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  // side: -1 = links, 1 = rechts
  function cannon(side, delay){
    const cols = C.lines.concat(C.hint, C.hint);
    const k = Math.min(1.6, Math.max(1, Math.min(W, H) / 420)); // größere Schnipsel auf Tablets
    for (let i = 0; i < 80; i++) {
      const r = Math.random();
      parts.push({
        x: side < 0 ? -6 : W + 6, y: H * rnd(0.9, 1.0),
        vx: -side * W * rnd(0.12, 1.9), vy: -H * rnd(1.9, 3.2),
        wait: delay + rnd(0, 0.05), age: 0, life: rnd(2.7, 3.7),
        kind: r < 0.66 ? 0 : (r < 0.86 ? 1 : 2), // Streifen, Punkt, Ring (wie eine Station)
        w: rnd(7, 12) * k, h: rnd(4, 6) * k, s: rnd(3, 4.4) * k,
        col: cols[Math.floor(Math.random() * cols.length)],
        rot: rnd(0, Math.PI * 2), vr: rnd(-7, 7), flip: rnd(0, Math.PI * 2), vf: rnd(7, 15),
        sway: rnd(10, 26) * k, sf: rnd(2.5, 5), sp: rnd(0, Math.PI * 2), vt: H * rnd(0.16, 0.32),
      });
    }
  }
  function step(dt){
    let alive = 0;
    for (const p of parts) {
      if (p.dead) continue;
      if (p.wait > 0) { p.wait -= dt; alive++; continue; }
      p.age += dt;
      if (p.age >= p.life || p.y > H + 40) { p.dead = true; continue; }
      alive++;
      if (p.vy < 0) { p.vy = (p.vy + 2.6 * H * dt) * Math.exp(-1.5 * dt); } // Steigflug, gebremst
      else p.vy += (p.vt - p.vy) * Math.min(1, 4 * dt);                    // Flattern nach unten
      p.vx *= Math.exp(-2.2 * dt);
      const swing = p.vy > 0 ? Math.min(1, p.vy / p.vt) * Math.cos(p.age * p.sf + p.sp) * p.sway * p.sf : 0;
      p.x += (p.vx + swing) * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt; p.flip += p.vf * dt;
    }
    return alive;
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      if (p.dead || p.wait > 0) continue;
      ctx.globalAlpha = Math.max(0, Math.min(1, (p.life - p.age) / 0.7)) * fade;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.kind === 0) {
        ctx.scale(1, Math.cos(p.flip));
        ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        ctx.scale(Math.max(0.2, Math.abs(Math.cos(p.flip))), 1);
        ctx.beginPath(); ctx.arc(0, 0, p.s, 0, Math.PI * 2);
        if (p.kind === 1) { ctx.fillStyle = p.col; ctx.fill(); }
        else { ctx.fillStyle = C.surface; ctx.fill(); ctx.lineWidth = p.s * 0.6; ctx.strokeStyle = p.col; ctx.stroke(); }
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function frame(now){
    raf = 0;
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (fading) fade = Math.max(0, fade - dt / 0.25);
    const alive = step(dt);
    draw();
    if (alive && fade > 0) raf = requestAnimationFrame(frame); else end();
  }
  function end(){
    if (raf) cancelAnimationFrame(raf);
    raf = 0; parts = []; fading = false; fade = 1;
    ctx.clearRect(0, 0, W, H); cv.hidden = true;
  }
  window.addEventListener('resize', () => { if (parts.length) fit(); });
  return {
    start(){
      end(); fit();
      cannon(-1, 0); cannon(1, 0.12);
      cv.hidden = false;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    },
    // sanft ausblenden (z. B. wenn man vorher auf „Weiter“ tippt)
    stop(){ if (parts.length) fading = true; },
  };
})();

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const els = {
  app: $('app'), home: $('home'), dlg: $('dlg'), board: $('board'), wrap: $('boardWrap'), perfect: $('perfect'), preview: $('preview'),
  lvl: $('lvlNum'), lvlLabel: $('lvlLabel'), hearts: $('hearts'), hint: $('btnHint'), reset: $('btnReset'), hintCount: $('hintCount'),
  coach: $('coach'), sound: $('tglSound'), vib: $('tglVib'), zoom: $('btnZoom'), grid: $('btnGrid'), zoomTip: $('zoomTip'), foot: $('foot'), restart: $('btnRestart'),
  classic: $('btnClassic'), classicHearts: $('classicHearts'), classicStats: $('classicStats'),
  hc: $('btnHc'), hcHearts: $('hcHearts'), hcStats: $('hcStats'), buy: $('btnBuy'), buyPrice: $('buyPrice'),
  blitz: $('btnBlitz'), blitzTime: $('blitzTime'), blitzStats: $('blitzStats'), timer: $('timer'), timerTxt: $('timerTxt'),
  dEyebrow: $('dlgEyebrow'), dTitle: $('dlgTitle'), dText: $('dlgText'), dReward: $('dlgReward'),
  dPrimary: $('dlgPrimary'), dSecondary: $('dlgSecondary'), dSheet: document.querySelector('#dlg .sheet'),
};
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.7 1.1 4.8 2.8 1.1-1.7 2.8-2.8 4.8-2.8 3.3 0 5.6 3.1 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>';
const heartsHtml = (have, max) => Array.from({ length: max }, (_, i) => `<span class="${i < have ? 'full' : 'lost'}">${HEART}</span>`).join('');

// mode: 'normal' (3 Herzen pro Level), 'hc' (Hardcore: 5 Herzen für alle Level, eigener Spielstand)
// oder 'blitz' (zufällige Level gegen die Uhr; G.time = Restzeit in ms, G.seed = Startwert des Feldes)
const G = { mode: 'normal', n: 1, board: null, hearts: 3, crashes: 0, over: false, hint: -1, layout: null, screen: 'home', skip: null,
            time: BLITZ_START, seed: 0, streak: 0, streakAt: 0, streakBest: 0 };
const isHc = () => G.mode === 'hc';
const isBlitz = () => G.mode === 'blitz';
const hintPool = () => isHc() ? progress.hc : progress; // beide haben .hints (Blitz: Tipps kosten Zeit)
const eyebrow = () => (isHc() ? t('hardcore') + ' · ' : isBlitz() ? t('blitz') + ' · ' : '') + t('level') + ' ' + G.n;
const randomSeed = () => Math.floor(Math.random() * 0x7fffffff);
// Restzeit als m:ss, aufgerundet (0:00 erst, wenn die Zeit wirklich um ist)
const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
// Gespeicherten Blitz-Durchgang prüfen; kaputt oder abgelaufen → null (neuer Durchgang)
const validBlitzRun = r => r && Number.isInteger(r.n) && r.n >= 1 && r.n < 1e5 && Number.isFinite(r.time) && r.time > 0
  ? Object.assign({}, r, { time: Math.min(r.time, 36e5) }) : null;

// Verzögerte Schritte nach Levelende (Konfetti → Fenster). Wird abgebrochen, wenn man vorher
// ins Menü geht oder neu startet, damit kein Fenster über dem Menü auftaucht.
let pendingTimers = [];
function later(fn, ms){ pendingTimers.push(setTimeout(fn, ms)); }
function cancelPending(){ pendingTimers.forEach(clearTimeout); pendingTimers = []; G.skip = null; }

function startLevel(n, restore){
  cancelPending(); Confetti.stop();
  G.n = n;
  if (isBlitz()) G.seed = restore && Number.isInteger(restore.seed) ? restore.seed : randomSeed();
  G.board = new Board(generateLevel(n, isBlitz() ? G.seed : undefined));
  resetZoom();
  G.hearts = isHc() ? progress.hc.hearts : 3;
  G.crashes = 0; G.over = false; G.hint = -1;
  resetStreak(); G.streakBest = 0; hidePerfect();
  // Stand aus einer älteren Level-Erzeugung (anderes Feld ab Level 31): Level, Herzen und Zeit bleiben,
  // die entfernten Pfeile und der Tipp gehörten aber zum alten Feld → Feld frisch
  const sameField = restore && (restore.v === LEVEL_GEN || n <= 30);
  const ids = sameField && Array.isArray(restore.removed)
    ? [...new Set(restore.removed)].filter(id => Number.isInteger(id) && id >= 0 && id < G.board.level.arrows.length) : [];
  if (restore && ids.length < G.board.level.arrows.length) { // kaputter oder schon gelöster Stand → frisch anfangen
    for (const id of ids) { G.board.remove(id); G.board.gone[id] = true; }
    if (G.mode === 'normal') G.hearts = validHearts(restore.hearts);
    G.crashes = Math.max(0, restore.crashes | 0);
    if (sameField && Number.isInteger(restore.hint) && G.board.alive[restore.hint]) G.hint = restore.hint;
  }
  // bezahlten Tipp vom alten Feld zurückgeben (Blitz: Tipps kosten Zeit, nicht Vorrat)
  if (restore && !sameField && Number.isInteger(restore.hint) && restore.hint >= 0 && !isBlitz()) { hintPool().hints++; saveProgress(); }
  els.dlg.hidden = true;
  saveRun();
  renderHud(); renderCoach();
  kick();
}

// Herzen im klassischen Modus: 1–3, alles andere (kaputter Spielstand) zählt als 3
const validHearts = h => Number.isInteger(h) && h >= 1 && h <= 3 ? h : 3;

// Stand des laufenden Levels speichern (oder löschen, wenn es vorbei ist)
function saveRun(){
  if (!G.board) return;
  if (isBlitz() && G.over) return; // Blitz: Levelwechsel (blitzWin) und Zeitende (blitzTimeUp) speichern selbst
  progress.run[G.mode] = G.over ? null : {
    n: G.n, v: LEVEL_GEN,
    removed: G.board.level.arrows.filter(a => !G.board.alive[a.id]).map(a => a.id),
    hearts: G.hearts, crashes: G.crashes, hint: G.hint,
    ...(isBlitz() && { seed: G.seed, time: Math.max(0, Math.round(G.time)) }),
  };
  saveProgress();
}

function renderHud(){
  const blitz = isBlitz();
  els.app.classList.toggle('hc', isHc());
  els.app.classList.toggle('blitz', blitz);
  els.lvlLabel.textContent = isHc() ? t('hardcore') : blitz ? t('blitz') : t('level');
  els.lvl.textContent = G.n;
  els.hearts.hidden = blitz;
  els.timer.hidden = !blitz;
  if (!blitz) {
    els.hearts.innerHTML = heartsHtml(G.hearts, isHc() ? HC_HEARTS : 3);
    els.hearts.setAttribute('aria-label', t('hearts', G.hearts));
  }
  els.reset.hidden = blitz; // Blitz: „Neu“ startet schon einen neuen Durchgang
  els.reset.disabled = !blitz && atModeStart();
  renderZoomBtn();
  els.grid.setAttribute('aria-pressed', String(!!progress.grid));
  if (blitz) {
    els.hintCount.textContent = t('secs', -BLITZ_HINT / 1000);
    tSecs = -1; renderTimer();
  } else {
    els.hintCount.textContent = hintPool().hints;
    els.hint.disabled = hintPool().hints <= 0 && G.hint === -1;
  }
  fitFooter();
}

/* ---------- Blitz: Uhr ----------
   Die Zeit läuft nur, solange das Spielfeld zu sehen ist: nicht im Menü, nicht bei offenem Fenster,
   nicht zwischen zwei Levels und nicht, wenn die App im Hintergrund ist. Gezählt wird pro Bild
   höchstens 100 ms, damit Ruckler oder eine eingefrorene Seite keine Zeit kosten. */
let tLast = null, tSecs = -1, tSaved = 0;
function blitzRunning(){ return isBlitz() && G.screen === 'game' && !!G.board && !G.over && els.dlg.hidden && !document.hidden; }
function blitzTick(now){
  if (!blitzRunning()) { tLast = null; return false; }
  if (tLast !== null) G.time -= Math.min(100, Math.max(0, now - tLast));
  tLast = now;
  if (G.time <= 0) { blitzTimeUp(); return false; }
  if (now - tSaved > 5000) { tSaved = now; saveRun(); } // falls die App hart beendet wird
  renderTimer(true);
  return true;
}
function renderTimer(ticking){
  const s = Math.max(0, Math.ceil(G.time / 1000));
  if (s === tSecs) return;
  if (ticking && s < tSecs && s <= 5 && s > 0) tone(1320, 0.05, 'square', 0.03); // Ticken in den letzten 5 Sekunden
  tSecs = s;
  els.timerTxt.textContent = fmtTime(G.time);
  els.timer.classList.toggle('low', s <= 10);
  els.hint.disabled = G.hint === -1 && (G.over || G.time <= BLITZ_HINT);
}
// Zeit gutschreiben (+) oder abziehen (−), mit schwebender Anzeige unter der Uhr
function blitzAdd(ms){
  G.time = Math.max(0, G.time + ms);
  const el = document.createElement('span');
  el.className = 'tfloat ' + (ms > 0 ? 'plus' : 'minus');
  el.textContent = t('secs', Math.round(ms / 1000));
  els.timer.appendChild(el);
  setTimeout(() => el.remove(), 1200);
  renderTimer();
  if (G.time <= 0 && !G.over) blitzTimeUp();
}
// Level geschafft: Zeit dazu, nächstes Zufalls-Level sofort als Durchgang speichern, kurz danach starten
function blitzWin(){
  blitzAdd(blitzBonus(G.board.level.arrows.length));
  const next = G.n + 1;
  progress.run.blitz = { n: next, v: LEVEL_GEN, seed: randomSeed(), removed: [], hearts: 3, crashes: 0, hint: -1, time: Math.round(G.time) };
  saveProgress();
  later(() => { sndWin(); buzz(30); }, 120);
  const go = () => { cancelPending(); if (G.screen === 'game' && isBlitz()) startLevel(next, progress.run.blitz); };
  G.skip = go; // Tippen aufs Feld überspringt die kurze Pause
  later(go, 750 / SPEED);
}
// Zeit abgelaufen: Durchgang vorbei, Rekord = höchstes erreichtes Level
function blitzTimeUp(){
  G.over = true; G.time = 0; G.hint = -1;
  renderHud(); kick();
  const b = progress.blitz, reached = G.n, prevBest = b.best, record = reached > prevBest;
  if (record) b.best = reached;
  progress.run.blitz = null;
  saveProgress();
  later(() => {
    if (record && !reduceMotion) { Confetti.start(); sndCelebrate(); buzz(25); }
    else if (record) { sndWin(); buzz(30); }
    else { sndGameOver(); buzz(160); }
    showDialog({
      eyebrow: eyebrow(),
      title: t('blitzOverTitle'),
      text: t('blitzOverText', reached) + (!record && prevBest > reached ? ' ' + t('hcRecord', prevBest) : ''),
      chip: record ? t('hcNewRecord') : null, party: record && !reduceMotion,
      primary: [t('retry'), newBlitzRun],
      secondary: [t('menu'), goHome],
    });
  }, 650);
}
function newBlitzRun(){
  // Ein abgebrochener Durchgang zählt trotzdem für den Rekord
  if (isBlitz() && G.board && !G.over && G.n > progress.blitz.best) progress.blitz.best = G.n;
  progress.run.blitz = null;
  G.mode = 'blitz'; G.time = BLITZ_START;
  startLevel(1);
}
// Pause (Menü, App im Hintergrund): Uhr anhalten und Restzeit speichern
function pauseClock(){
  tLast = null;
  if (isBlitz() && G.board && !G.over) saveRun();
}

function renderCoach(){
  const msg = G.n <= 3 && !isBlitz() ? t('coach' + G.n) : '';
  els.coach.hidden = !msg;
  if (msg) els.coach.textContent = msg;
}

/* ---------- Streak ----------
   Pfeile schnell hintereinander rausfahren: Jeder Pfeil, der höchstens STREAK_GAP ms nach dem vorigen rausfährt,
   zählt die Streak hoch. Ab STREAK_SHOW schwebt ein Schild „STREAK ×N“ über der angetippten Stelle, der Ton steigt mit.
   Ein Zusammenstoß oder ein neues Level beendet sie. Nur zur Motivation: kein Einfluss auf Herzen, Zeit, Tipps
   oder den Spielstand (nicht gespeichert). Die längste Streak des Levels steht im Gewinnfenster. */
const STREAK_GAP = 1200, STREAK_SHOW = 3;
let streakEl = null;
function resetStreak(){
  G.streak = 0; G.streakAt = 0;
  if (streakEl) { streakEl.remove(); streakEl = null; }
}
// Pfeil ist rausgefahren: Streak weiterzählen oder neu bei 1 beginnen; gibt die neue Länge zurück
function streakStep(now, x, y){
  G.streak = G.streakAt && now - G.streakAt <= STREAK_GAP ? G.streak + 1 : 1;
  G.streakAt = now;
  G.streakBest = Math.max(G.streakBest, G.streak);
  if (G.streak >= STREAK_SHOW) showStreak(G.streak, x, y);
  return G.streak;
}
function showStreak(n, x, y){
  if (streakEl) streakEl.remove(); // immer nur das neueste Schild
  const el = streakEl = document.createElement('span');
  const tier = n >= 30 ? 5 : n >= 20 ? 4 : n >= 15 ? 3 : n >= 10 ? 2 : n >= 5 ? 1 : 0;
  el.className = 'streak t' + tier + (n % 5 === 0 ? ' big' : '');
  el.setAttribute('aria-hidden', 'true');

  word.className = 's-word'; word.textContent = t('streak');

  el.append(word, num);
  els.wrap.appendChild(el);
  // über dem Finger (sonst darunter, wenn oben kein Platz ist), seitlich im Spielfeld halten
  const w = el.offsetWidth, h = el.offsetHeight, W = els.wrap.clientWidth;
  el.style.left = Math.round(Math.max(w / 2 + 6, Math.min(W - w / 2 - 6, x))) + 'px';
  el.style.top = Math.round(y - 30 - h >= 4 ? y - 30 - h : y + 26) + 'px';
  setTimeout(() => { el.remove(); if (streakEl === el) streakEl = null; }, 1000);

/* ---------- „Perfekte Runde!“ beim Konfetti (fehlerfrei gelöst) ---------- */
let perfectTimer = 0;
function showPerfect(){
  const el = els.perfect;
  clearTimeout(perfectTimer);
  el.textContent = t('perfect');
  el.classList.remove('out');
  el.hidden = true; void el.offsetWidth; el.hidden = false; // Animation neu starten
}
function hidePerfect(fade){
  const el = els.perfect;

  if (el.hidden) return;
  if (!fade) { el.hidden = true; el.classList.remove('out'); return; }
  el.classList.add('out');

function onBoardTap(px, py){
  if (G.over && G.skip) { G.skip(); return; } // Tippen während des Konfettis zeigt das Fenster sofort
  if (G.over || !G.board) return;
  const id = pickArrow(G.board, G.layout, px, py);
  if (id < 0) return;
  audio();
  const now = performance.now();
  const r = G.board.tap(id, now);
  if (r.ok) {
    const s = streakStep(now, px, py);
    sndRelease(s - 1);
    if (s >= 5 && s % 5 === 0) { sndStreak(); buzz(22); } else buzz(12);
    if (G.hint === id) G.hint = -1;
    if (G.board.left === 0) { G.over = true; if (isBlitz()) blitzWin(); else win(); }
  } else {
    G.crashes++;
    resetStreak();
    sndCrash(); buzz(70);
    const shakeEl = isBlitz() ? els.timer : els.hearts;
    shakeEl.classList.remove('shake'); void shakeEl.offsetWidth; shakeEl.classList.add('shake');
    if (isBlitz()) {
      blitzAdd(-BLITZ_CRASH); // Zusammenstoß kostet Zeit; bei 0 ist der Durchgang vorbei
    } else if (isHc()) {
      // Herz sofort speichern: App schließen bringt es nicht zurück
      G.hearts--;
      progress.hc.hearts = Math.max(0, G.hearts);
      if (G.hearts <= 0) { G.over = true; hcGameOver(); } else saveProgress();
    } else if (--G.hearts <= 0) { G.over = true; later(lose, 650); }
  }
  saveRun();
  renderHud(); kick();
}

function win(){
  // Fortschritt sofort speichern, auch wenn man vor dem Fenster ins Menü geht
  const flawless = G.crashes === 0;
  let reward = false;
  if (isHc()) {
    const hc = progress.hc;
    hc.level = G.n + 1;
    if (hc.level > hc.best) { hc.best = hc.level; hc.newBest = true; }
    if (G.n % 2 === 0) { hc.hints++; reward = true; }
    saveProgress();
  } else if (G.n >= progress.level) {
    progress.level = G.n + 1;
    if (flawless) progress.flawless++;
    if (G.n % 2 === 0) { progress.hints++; reward = true; }
    saveProgress();
  }
  const show = party => {
    cancelPending();
    hidePerfect(true);
    if (!party) { sndWin(); buzz(30); }
    showDialog({
      eyebrow: eyebrow(),
      title: t('winTitle'),
      text: t('winText', G.crashes) + (isHc() ? ' ' + t('hcLeft', G.hearts) : '')
        + (G.streakBest >= STREAK_SHOW ? ' ' + t('streakBest', G.streakBest) : ''),
      chip: reward ? t('reward') : null, party,
      primary: [t('next'), nextLevel],
      secondary: [t('menu'), goHome],
    });
  };
  if (!flawless || reduceMotion) { later(() => show(false), 520 / SPEED); return; }
  // Fehlerfrei: erst Konfetti mit „Perfekte Runde!“, dann das Fenster
  later(() => {
    Confetti.start(); sndCelebrate(); showPerfect();
    buzz(25); later(() => buzz(25), 130);
    G.skip = () => show(true);
    later(() => show(true), 1000);
  }, 360);
}

  showDialog({

function useHint(){
  if (G.over || !G.board) return;
  if (G.hint !== -1 && G.board.alive[G.hint]) return;
  // Blitz: Tipps sind unbegrenzt, kosten aber Zeit (nicht nutzbar, wenn sie die letzte Zeit kosten würden)
  if (isBlitz() ? G.time <= BLITZ_HINT : hintPool().hints <= 0) return;
  const free = freeArrows(G.board.level, G.board.alive);
  if (!free.length) return;
  G.hint = free[Math.floor(Math.random() * free.length)];
  showArrow(G.hint);
  if (isBlitz()) blitzAdd(-BLITZ_HINT); else hintPool().hints--;

  buzz(15); renderHud(); kick();
}

      G.mode = 'blitz';
      const run = validBlitzRun(progress.run.blitz);
      G.time = run ? run.time : BLITZ_START;
      startLevel(run ? run.n : 1, run);
    }
  } else {
    const target = mode === 'hc' ? progress.hc.level : progress.level;
    if (!G.board || G.mode !== mode || G.n !== target || G.over) {
      G.mode = mode;

const demo = { board: null, next: 0, seed: 1 };
function newDemo(){
  const spec = { cols: 9, rows: 5, maxArrows: Infinity, minLen: 2, maxLen: 6, turnP: 0.35 };
  demo.board = new Board(buildLevel(spec, 900 + demo.seed++));
  demo.next = performance.now() + 900;
}
function stepDemo(now){
  if (!demo.board) newDemo();
  if (reduceMotion) return;
  if (now < demo.next) return;
  const b = demo.board;
  if (b.left === 0) { if (!b.busy()) newDemo(); return; }
  const free = freeArrows(b.level, b.alive);
  if (free.length) b.tap(free[Math.floor(Math.random() * free.length)], now);
  demo.next = now + (b.left === 0 ? 1400 : 520);
}

let raf = 0, dirty = true;
function kick(){ dirty = true; if (!raf) raf = requestAnimationFrame(frame); }
function frame(now){
  raf = 0;

      drawBoard(ctx, G.board, G.layout, now, { hint: G.hint, grid: !!progress.grid });
      if (Z.k > 1) drawZoomBars(ctx, G.layout, w, h);
      if (G.board.busy() || G.hint !== -1 || G.board.flash || Z.anim) { dirty = true; again = true; }
    }
  } else if (G.screen === 'home') {
    dirty = true;
    stepDemo(now);
    const { w, h, dpr } = fitCanvas(els.preview);

    ctx.clearRect(0, 0, w, h);
    const b = demo.board;
    if (h >= 44) drawBoard(ctx, b, layoutFor(w, h, b.W, b.H, 40), now, {}); // zu klein → leer lassen
    again = !reduceMotion;

}

/* ---------- Zoom für große Felder ----------
   Ist das ganze Feld nur mit Zellen unter ZOOM_FROM px darstellbar, kann man hineinzoomen:
   zwei Finger (Pinch), Lupen-Knopf in der Fußleiste oder Mausrad (Browser). Gezoomt verschiebt
   ein Finger das Feld, Tippen fährt Pfeile raus wie immer. Jedes neue Level startet mit dem ganzen Feld.
   Z.k = Zoomfaktor gegenüber „ganzes Feld“ (1), Z.cx/Z.cy = Mitte der Ansicht in Zellen. */
const ZOOM_FROM = 30, ZOOM_CELL = 44, ZOOM_MAX_CELL = 64;
const Z = { k: 1, cx: 0, cy: 0, anim: null, can: false, on: false, fit: null, w: 0, h: 0, tipShown: false };
const zoomMax = () => Z.fit ? Math.max(1, ZOOM_MAX_CELL / Z.fit.cell) : 1;
function resetZoom(){
  Z.k = 1; Z.anim = null; Z.tipShown = false;
  Z.cx = G.board.W / 2; Z.cy = G.board.H / 2;
  els.zoomTip.hidden = true;
}
// Ansicht für Zoomfaktor k mit Mitte (cx, cy); hält das Feld im Bild (höchstens pad px Rand)
function viewFor(k, cx, cy){
  const fit = Z.fit, W = G.board.W, H = G.board.H;
  if (k <= 1.001) return { k: 1, cx: W / 2, cy: H / 2, cell: fit.cell, ox: fit.ox, oy: fit.oy };
  const cell = fit.cell * k, pad = 10;
  const axis = (view, n, c) => {
    const size = cell * n;
    return size + pad * 2 <= view ? (view - size) / 2 : Math.min(pad, Math.max(view - pad - size, view / 2 - c * cell));
  };
  const ox = axis(Z.w, W, cx), oy = axis(Z.h, H, cy);
  return { k, cx: (Z.w / 2 - ox) / cell, cy: (Z.h / 2 - oy) / cell, cell, ox, oy };
}
// Wird bei jedem Zeichnen aufgerufen: Zoom-Animation fortschreiben, Ansicht berechnen, Knopf/Hinweis aktualisieren
function boardView(w, h, now){
  Z.w = w; Z.h = h;
  Z.fit = layoutFor(w, h, G.board.W, G.board.H, 64);
  const can = Z.fit.cell < ZOOM_FROM;
  if (!can) { Z.k = 1; Z.anim = null; }
  if (Z.anim) {
    const e = Math.min(1, (now - Z.anim.t0) / (260 / SPEED)), q = 1 - Math.pow(1 - e, 3);
    const f = Z.anim.from, to = Z.anim.to;
    Z.k = f.k * Math.pow(to.k / f.k, q); Z.cx = f.cx + (to.cx - f.cx) * q; Z.cy = f.cy + (to.cy - f.cy) * q;
    if (e >= 1) Z.anim = null;
  }
  const v = viewFor(Z.k, Z.cx, Z.cy);
  Z.k = v.k; Z.cx = v.cx; Z.cy = v.cy;
  if (can !== Z.can || (Z.k > 1) !== Z.on) { Z.can = can; Z.on = Z.k > 1; renderZoomBtn(); }
  if (can && !Z.tipShown) { Z.tipShown = true; zoomTip(); }
  return v;
}
function renderZoomBtn(){
  const show = els.zoom.hidden === Z.can;
  els.zoom.hidden = !Z.can;
  els.zoom.setAttribute('aria-pressed', String(Z.on));
  els.zoom.setAttribute('aria-label', Z.on ? t('zoomOut') : t('zoomIn'));
  if (show) fitFooter();
}
// Passen nicht alle Knöpfe mit Text in die Fußleiste, werden sie stufenweise zu Symbolen:
// erst „Neu“ (compact, ↻), dann „Modus neu“ (mini, ⏮), zuletzt „Tipp“ (tight: Glühbirne + Zahl).
// Der oft gebrauchte Tipp-Knopf behält sein Wort am längsten. Jede Stufe erst anwenden, dann messen.
function fitFooter(){
  const f = els.foot;
  const fits = () => f.scrollWidth <= f.clientWidth + 1;
  f.classList.remove('compact', 'tight', 'mini'); els.restart.classList.remove('icon'); els.reset.classList.remove('icon');
  if (fits()) return;
  f.classList.add('compact'); els.restart.classList.add('icon');
  if (fits()) return;
  f.classList.add('mini'); els.reset.classList.add('icon');
  if (fits()) return;
  f.classList.add('tight');
}
function animateZoom(k, cx, cy){
  const v = viewFor(Math.max(1, Math.min(zoomMax(), k)), cx, cy);
  Z.anim = { t0: performance.now(), from: { k: Z.k, cx: Z.cx, cy: Z.cy }, to: { k: v.k, cx: v.cx, cy: v.cy } };
  kick();
}
// Zoomen, sodass der Feldpunkt unter (sx, sy) dort bleibt (Mausrad)
function zoomAt(k, sx, sy){
  const L = G.layout;
  const bx = (sx - L.ox) / L.cell, by = (sy - L.oy) / L.cell;
  Z.k = Math.max(1, Math.min(zoomMax(), k)); Z.anim = null;
  const cell = Z.fit.cell * Z.k;
  Z.cx = (Z.w / 2 - sx) / cell + bx; Z.cy = (Z.h / 2 - sy) / cell + by;
  if (Z.k > 1) zoomUsed();
  kick();
}
function toggleZoom(){
  if (!Z.can || !G.board) return;
  buzz(10);
  if (Z.k > 1) { animateZoom(1, 0, 0); return; }
  // hinein: auf den Tipp-Pfeil, sonst auf die Mitte
  const c = G.hint >= 0 && G.board.alive[G.hint] ? arrowBox(G.hint) : { x: G.board.W / 2, y: G.board.H / 2 };
  animateZoom(Math.max(1.5, ZOOM_CELL / Z.fit.cell), c.x, c.y);
  zoomUsed();
}
// Mitte und Ausdehnung eines Pfeils in Zellen
function arrowBox(id){
  const a = G.board.level.arrows[id], W = G.board.W;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const c of a.cells) { const x = c % W + 0.5, y = Math.floor(c / W) + 0.5; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, x0, x1, y0, y1 };
}
// Gezoomt: Pfeil ins Bild holen, falls er (teilweise) außerhalb liegt
function showArrow(id){
  if (Z.k <= 1 || !G.layout) return;
  const b = arrowBox(id), L = G.layout, m = L.cell * 0.7;
  const sx = x => L.ox + x * L.cell, sy = y => L.oy + y * L.cell;
  if (sx(b.x0) >= m && sx(b.x1) <= Z.w - m && sy(b.y0) >= m && sy(b.y1) <= Z.h - m) return;
  animateZoom(Z.k, b.x, b.y);
}
// Gezoomt: dünne Balken am Rand zeigen, welcher Teil des Feldes zu sehen ist
function drawZoomBars(ctx, L, w, h){
  const pad = 10, bw = L.cell * G.board.W, bh = L.cell * G.board.H;
  ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = C.ink;
  if (bw + pad * 2 > w + 1) {
    const track = w - 24, len = Math.max(28, track * w / (bw + pad * 2)), s = (pad - L.ox) / (bw + pad * 2 - w);
    roundRect(ctx, 12 + s * (track - len), h - 6, len, 4, 2); ctx.fill();
  }
  if (bh + pad * 2 > h + 1) {
    const track = h - 24, len = Math.max(28, track * h / (bh + pad * 2)), s = (pad - L.oy) / (bh + pad * 2 - h);
    roundRect(ctx, w - 6, 12 + s * (track - len), 4, len, 2); ctx.fill();
  }
  ctx.restore();
}
// Hinweis „Großes Feld: … zoomen“ – bis man einmal gezoomt hat, höchstens dreimal
function zoomTip(){
  if (progress.zoomed || (progress.zoomTips | 0) >= 3 || G.n <= 3) return;
  progress.zoomTips = (progress.zoomTips | 0) + 1; saveProgress();
  const el = els.zoomTip;
  el.textContent = t('zoomTip');
  el.hidden = true; void el.offsetWidth; el.hidden = false;
  clearTimeout(zoomTip.timer);
  zoomTip.timer = setTimeout(() => { el.hidden = true; }, 6000);
}
function zoomUsed(){
  els.zoomTip.hidden = true;
  if (!progress.zoomed) { progress.zoomed = true; saveProgress(); }
}

/* ---------- Eingabe ----------
   Ein Finger: Tippen (Pfeil raus) oder – gezoomt – Feld verschieben. Zwei Finger: zoomen. */
const ptrs = new Map();
let gest = null; // { type: 'tap' | 'pan' | 'pinch' | 'none', ... }
const TAP_SLOP = 12;
function boardPoint(e){ const r = els.board.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function startPinch(){
  const [a, b] = [...ptrs.values()], L = G.layout;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  Z.anim = null;
  gest = { type: 'pinch', d0: Math.max(24, Math.hypot(a.x - b.x, a.y - b.y)), k0: Z.k, bx: (mx - L.ox) / L.cell, by: (my - L.oy) / L.cell };
}
els.board.addEventListener('pointerdown', e => {
  const p = boardPoint(e);
  ptrs.set(e.pointerId, p);
  try { els.board.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size === 1) gest = { type: 'tap', id: e.pointerId, x0: p.x, y0: p.y, lx: p.x, ly: p.y };
  else if (ptrs.size === 2 && Z.can && G.board && G.layout) startPinch();
  else gest = { type: 'none' };
});
els.board.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !gest) return;
  const p = boardPoint(e);
  ptrs.set(e.pointerId, p);
  if (gest.type === 'tap' && Math.hypot(p.x - gest.x0, p.y - gest.y0) > TAP_SLOP)
    gest = Z.k > 1 ? { type: 'pan', id: gest.id, lx: gest.x0, ly: gest.y0 } : { type: 'none' };
  if (gest.type === 'pan' && e.pointerId === gest.id) {
    const cell = Z.fit.cell * Z.k;
    Z.cx -= (p.x - gest.lx) / cell; Z.cy -= (p.y - gest.ly) / cell; Z.anim = null;
    gest.lx = p.x; gest.ly = p.y;
    kick();
  } else if (gest.type === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    Z.k = Math.max(1, Math.min(zoomMax(), gest.k0 * Math.hypot(a.x - b.x, a.y - b.y) / gest.d0));
    const cell = Z.fit.cell * Z.k;
    Z.cx = (Z.w / 2 - mx) / cell + gest.bx; Z.cy = (Z.h / 2 - my) / cell + gest.by;
    if (Z.k > 1.05) zoomUsed();
    kick();
  }
});
function endPointer(e, cancelled){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gest && gest.type === 'tap' && gest.id === e.pointerId && !cancelled) { const p = boardPoint(e); onBoardTap(p.x, p.y); }
  if (ptrs.size === 1 && gest && gest.type === 'pinch') { // ein Finger bleibt liegen → weiter verschieben
    const [[id, p]] = [...ptrs];
    gest = Z.k > 1 ? { type: 'pan', id, lx: p.x, ly: p.y } : { type: 'none' };
  }
  if (!ptrs.size) gest = null;
}
els.board.addEventListener('pointerup', e => endPointer(e, false));
els.board.addEventListener('pointercancel', e => endPointer(e, true));
els.board.addEventListener('wheel', e => {
  if (!Z.can || !G.board || !G.layout) return;
  e.preventDefault();
  const p = boardPoint(e);
  zoomAt(Z.k * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), p.x, p.y);
}, { passive: false });
els.zoom.addEventListener('click', toggleZoom);
// Raster ein/aus: gespeichert in progress.grid, gilt für alle Modi und bleibt nach dem Neustart
els.grid.addEventListener('click', () => {
  progress.grid = !progress.grid; saveProgress();
  buzz(10);
  els.grid.setAttribute('aria-pressed', String(progress.grid));
  kick();
});
$('btnHint').addEventListener('click', useHint);
els.reset.addEventListener('click', askResetMode);
$('btnRestart').addEventListener('click', () => {
  if (!G.board || G.over) return;
  if (isBlitz()) restartBlitz(); else startLevel(G.n);
});
$('btnHome').addEventListener('click', goHome);
els.classic.addEventListener('click', () => { audio(); goGame('normal'); });
els.hc.addEventListener('click', openHc);
els.blitz.addEventListener('click', openBlitz);
els.buy.addEventListener('click', buyFull);
// App im Hintergrund: Blitz-Uhr anhalten und Restzeit sichern (Android ruft zusätzlich pfPause auf)
document.addEventListener('visibilitychange', () => { pauseClock(); if (!document.hidden) kick(); });
window.pfPause = pauseClock;
els.sound.addEventListener('click', () => { progress.sound = !progress.sound; saveProgress(); renderHome(); if (progress.sound) tone(660, 0.12, 'triangle', 0.08); });
els.vib.addEventListener('click', () => { progress.vib = !progress.vib; saveProgress(); renderHome(); buzz(25); });
/* ---------- Einstellungen (Ton, Vibration, Sprache) ---------- */
const setDlg = $('setDlg');
function openSettings(){ setDlg.hidden = false; setTimeout(() => $('setClose').focus({ preventScroll: true }), 50); }
function closeSettings(){ setDlg.hidden = true; $('btnSettings').focus({ preventScroll: true }); }
$('btnSettings').addEventListener('click', openSettings);
$('setClose').addEventListener('click', closeSettings);
setDlg.addEventListener('click', e => { if (e.target === setDlg) closeSettings(); });
// Datenschutz und Impressum liegen als Webseite auf GitHub Pages (Ordner docs/). In der App öffnet sie der Browser.
const LEGAL_URL = 'https://dave6647.github.io/pfeilfrei/';
function openLink(path){
  const url = LEGAL_URL + path;
  buzz(10);
  if (bridge && typeof bridge.openUrl === 'function') bridge.openUrl(url);
  else window.open(url, '_blank', 'noopener');
}
$('btnPrivacy').addEventListener('click', () => openLink('privacy.html#' + progress.lang));
$('btnImprint').addEventListener('click', () => openLink('impressum.html' + (progress.lang === 'de' ? '' : '#en')));

/* ---------- Sprachauswahl ---------- */
const langDlg = $('langDlg'), langList = $('langList');
function renderLangList(){
  langList.innerHTML = LANGS.map(l =>
    `<button class="lang-row" role="radio" aria-checked="${l.code === progress.lang}" data-lang="${l.code}" lang="${l.html}">` +
    `<span class="stop" aria-hidden="true"></span><span class="lang-name">${l.name}</span></button>`).join('');
}
function openLang(){
  renderLangList();
  langDlg.hidden = false;
  const cur = langList.querySelector('[aria-checked="true"]');
  setTimeout(() => cur && cur.focus({ preventScroll: true }), 50);
}
function closeLang(){ langDlg.hidden = true; $('btnLang').focus({ preventScroll: true }); }
function setLang(code){
  if (!I18N[code] || progress.lang === code) return;
  progress.lang = code; saveProgress();
  applyLanguage(); renderHome(); renderHud(); renderCoach(); renderLangList(); buzz(10);
}
$('btnLang').addEventListener('click', openLang);
$('langClose').addEventListener('click', closeLang);
langDlg.addEventListener('click', e => { if (e.target === langDlg) closeLang(); });
langList.addEventListener('click', e => {
  const row = e.target.closest('.lang-row');
  if (!row) return;
  setLang(row.dataset.lang);
  setTimeout(closeLang, 260);
});
/* ---------- Debug: auf ein beliebiges Level springen (nur wenn DEBUG) ----------
   Setzt den Spielstand des gewählten Modus auf Level N und startet es frisch:
   Klassisch → progress.level; Hardcore → hc.level mit 5 vollen Herzen; Blitz → neuer Durchgang ab Level N mit 30 s.
   Was danach gespielt wird, zählt ganz normal (auch für Rekorde). */
const dbgDlg = $('dbgDlg'), dbgModes = $('dbgModes'), dbgLevel = $('dbgLevel');
let dbgMode = 'normal';
const dbgCurrent = m => m === 'hc' ? progress.hc.level : m === 'blitz' ? (validBlitzRun(progress.run.blitz) || { n: 1 }).n : progress.level;
function dbgSelect(m){
  dbgMode = m;
  dbgModes.querySelectorAll('.dbg-mode').forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === m)));
  dbgLevel.value = dbgCurrent(m);
}
function openDebug(){ dbgSelect(dbgMode); dbgDlg.hidden = false; setTimeout(() => $('dbgClose').focus({ preventScroll: true }), 50); }
function closeDebug(){ dbgLevel.blur(); dbgDlg.hidden = true; $('btnDebug').focus({ preventScroll: true }); }
function debugJump(){
  const n = Math.min(99999, parseInt(dbgLevel.value, 10));
  if (!(n >= 1)) { dbgLevel.focus(); return; }
  dbgLevel.blur();
  if (dbgMode === 'hc') {
    Object.assign(progress.hc, { level: n, hearts: HC_HEARTS, newBest: false });
    progress.run.hc = null;
  } else if (dbgMode === 'blitz') {
    progress.run.blitz = { n, v: LEVEL_GEN, seed: randomSeed(), removed: [], hearts: 3, crashes: 0, hint: -1, time: BLITZ_START };
  } else {
    progress.level = n;
    progress.run.normal = null;
  }
  saveProgress();
  G.board = null; // goGame startet dann sicher frisch aus dem neuen Stand
  dbgDlg.hidden = true; setDlg.hidden = true; buzz(15);
  goGame(dbgMode);
}
if (DEBUG) {
  $('btnDebug').hidden = false;
  $('btnDebug').addEventListener('click', openDebug);
  $('dbgClose').addEventListener('click', closeDebug);
  dbgDlg.addEventListener('click', e => { if (e.target === dbgDlg) closeDebug(); });
  dbgModes.addEventListener('click', e => { const b = e.target.closest('.dbg-mode'); if (b) dbgSelect(b.dataset.mode); });
  $('dbgChips').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (b) dbgLevel.value = b.dataset.n; });
  dbgLevel.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); debugJump(); } });
  $('dbgGo').addEventListener('click', debugJump);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') window.pfBack(); });

// Zurück-Taste unter Android: true = erledigt, false = App schließen
window.pfBack = function(){
  if (!dbgDlg.hidden) { closeDebug(); return true; }
  if (!langDlg.hidden) { closeLang(); return true; }
  if (!setDlg.hidden) { closeSettings(); return true; }
  if (!els.dlg.hidden || G.screen === 'game') { goHome(); return true; }
  return false;
};

/* ---------- Theme-Wechsel ---------- */
readColors();
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
if (mq && mq.addEventListener) mq.addEventListener('change', () => { readColors(); kick(); });
new MutationObserver(() => { readColors(); kick(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(kick);

/* ---------- Start ---------- */
applyLanguage();
function boot(data){
  const d = data || {};
  if (d.screen === 'game' && d.n) {
    G.mode = d.mode === 'hc' || d.mode === 'blitz' ? d.mode : 'normal';
    if (isBlitz()) G.time = Number.isFinite(d.time) && d.time > 0 ? d.time : BLITZ_START;
    G.screen = 'game'; els.home.hidden = true;
    startLevel(d.n, d);
  } else {
    goHome();
  }
  kick();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({
  screen: G.screen, mode: G.mode, n: G.n, hearts: G.hearts, crashes: G.crashes, seed: G.seed, time: G.time,
  removed: G.board ? G.board.level.arrows.filter(a => !G.board.alive[a.id]).map(a => a.id) : [],
}));
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data);
})();
</script>
